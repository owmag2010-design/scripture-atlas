# Ereunia — static site; data is built on Netlify from open sources. Primary domain: ereunia.com (ereunia.org redirects to it).
[build]
  publish = "public"
  # Every dataset is downloaded from its original open source and built here (see README).
  command = "node scripts/fetch-sources.mjs && node scripts/fetch-ebible.mjs && npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["public/data/index.json", "public/data/kjv/**", "public/data/web/**", "public/data/xref/**", "public/data/hist/vx/**", "public/data/hist/people.json", "public/data/hist/people/**", "public/data/hist/events.json", "public/data/orig/**", "public/data/lex/**"]

[[headers]]
  for = "/data/bible/*"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Frame-Options = "SAMEORIGIN"

# ereunia.org (and www) is an alias of the site; send every visitor to the same page on ereunia.com.
[[redirects]]
  from = "https://ereunia.org/*"
  to = "https://ereunia.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.ereunia.org/*"
  to = "https://ereunia.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://ereunia.org/*"
  to = "https://ereunia.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.ereunia.org/*"
  to = "https://ereunia.com/:splat"
  status = 301
  force = true

# Pages live at real paths (/read/kjv/John.1). Static files are served first; every other path loads the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
